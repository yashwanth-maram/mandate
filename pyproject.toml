[project]
name = "mandate"
version = "0.1.0"
description = "Intent-aware verification for autonomous payments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "openai>=3.7.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "razorpay>=2.0.1",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
